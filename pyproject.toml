[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datasheets-extraction-tool"
version = "0.1.0"
description = "CLI and MCP server for extracting structured data from electronic component datasheets"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2",
    "pydantic>=2.12.5",
    "mcp[cli]>=1.26.0,<2",
]

[project.scripts]
datasheet = "datasheet:main"
datasheets-server = "server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*.py"]
